# Ajustes SSH genéricos y seguros de compartir (sin hosts concretos).
# Se incluye desde ~/.ssh/config con:  Include ~/dotfiles/ssh/common.conf
#
# Connection multiplexing: reutiliza la conexión a un mismo host, así las
# reconexiones (otra pestaña, scp, rsync...) entran al instante y sin contraseña.
Host *
  ControlMaster auto
  ControlPath ~/.ssh/sockets/%r@%h:%p
  ControlPersist 600
