; Polybar — tema oscuro a juego con i3 (Orchis-Dark). Iconos: JetBrainsMono Nerd Font.
; Los @TOKENS@ de iconos se rellenan con bin/polybar-icons.py (bytes Nerd Font correctos).

[colors]
background     = #000000
background-alt = #1a1a1a
foreground     = #cccccc
primary        = #5294e2
green          = #8ae234
yellow         = #e5c07b
red            = #e2554e
disabled       = #707880

[bar/main]
monitor = eDP-1
width   = 100%
height  = 26pt
radius  = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0
padding-left  = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=13;3
font-2 = JetBrainsMono Nerd Font:style=Bold:size=10;2

modules-left   = i3
modules-center = date
modules-right  = cpu temperature memory fs wlan eth volume battery tray

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc = true

wm-restack = i3

[module/tray]
type = internal/tray
format-margin = 6px
tray-spacing = 6px
tray-background = ${colors.background}

[module/i3]
type = internal/i3
pin-workspaces = true
enable-click = true
enable-scroll = true
index-sort = true
; oculta el "N:" inicial (sirve solo para que i3 conserve el número y los atajos);
; el recuadro de color va incrustado en el nombre por rename-workspace.sh con %{B#hex}.
strip-wsnumbers = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.red}
label-mode-foreground = #ffffff

; El recuadro de color de cada workspace viene en su nombre (%{B#hex}). El foco se marca
; con subrayado blanco para no tapar el color propio de cada recuadro.
label-focused = %name%
label-focused-background = ${colors.background}
label-focused-underline = #ffffff
label-focused-padding = 1

label-visible = %name%
label-visible-background = ${colors.background}
label-visible-padding = 1

label-unfocused = %name%
label-unfocused-background = ${colors.background}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = #ffffff
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 6
warn-temperature = 75
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.yellow}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
label = %percentage_used:2%%

[module/fs]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %free%
format-unmounted =

[module/wlan]
type = internal/network
interface = wlp2s0
interval = 3
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = sin red

[module/eth]
type = internal/network
interface = enp0s31f6
interval = 3
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%
format-disconnected =

[module/volume]
type = custom/script
exec = ~/.local/bin/polybar-vol.sh
interval = 1
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll-up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.green}

label-charging = %percentage%%
label-discharging = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 600

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = " %date%  %time%"
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = false
